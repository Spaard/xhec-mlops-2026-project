[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Gaspard Baumelou (Spaard)", email = "gaspard.baumelou@gmail.com" },
  # Teammates: add your name and email below
  { name = "Leo Burtin", email = "leo.burtin@hec.edu" },
  { name = "Ayush Singh", email = "ayush.singh@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
readme = "README.md"
requires-python = ">=3.10,<3.12"

# App dependencies (training pipeline + prediction API)
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "prefect>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[dependency-groups]
# Dev dependencies (installed by default with `uv sync`)
dev = [
  "pre-commit>=3.5",
  "ruff>=0.5",
  "pytest>=8.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
